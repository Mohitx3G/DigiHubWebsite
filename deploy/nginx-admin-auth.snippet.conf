# HTTP Basic auth for the two admin surfaces. Paste into the
# digihubhmax.com server block in /etc/nginx/sites-available/digihub-website.
#
# WHY
# Both admin pages are reachable by anyone who knows the URL, and both URLs are
# public knowledge because the repo (github.com/Mohitx3G/DigiHubWebsite) is
# public. This puts a second, independent password in front of them, so a
# leaked or cracked in-page credential is not on its own enough to reach either
# panel.
#
# The website admin's JS bundle is covered too, not just its HTML page: that
# file carries the SHA-256 of the admin password, so leaving it public would
# defeat the point of protecting the page.
#
# ⚠️ PLACEMENT MATTERS. nginx tries regex locations in the order they appear,
# first match wins. This block MUST sit ABOVE both the
# `location ~* "^/assets/(css|js)/..."` block and the `location ~* \.html$`
# block, or those will match first and the auth never runs. Put it immediately
# after the `index index.html;` line.
#
# NOT covered on purpose: /api/mediakit/. The media kit admin page calls that
# endpoint with fetch(), which would not carry basic-auth credentials on a
# cross-path preflight cleanly. It stays protected by its own X-Admin-Key,
# which is a 192-bit random token and the stronger of the two secrets anyway.

location ~* "^/(admin\.html|mediakit/admin-[a-z0-9]+\.html|assets/js/admin\.[0-9a-f]{10}\.js)$" {
    auth_basic "DigiHub admin";
    auth_basic_user_file /etc/nginx/.digihub-admin;

    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
}
